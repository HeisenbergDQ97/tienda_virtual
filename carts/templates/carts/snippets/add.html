<form action = "{% url 'carts:add' %}"method = "post">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <div class="d-flex flex-row gap-2">
        <button type="button" class="btn btn-info btn-sm" id="remove">-</button>
        <input type="number" value="1" class="form-control text-center" style="width: 70px;" id="quantity" name="quantity" readonly>
        <button type="button" class="btn btn-info btn-sm" id="add">+</button>
    </div>
    <div class="mt-2">
        <button type="submit" class="btn btn-warning">
            <span class="fas fa-cart-plus"></span> Agregar al carrito
        </button>
    </div>
</form>
<script>
    const add = document.getElementById('add')
    const remove = document.getElementById('remove')
    const quantity= document.getElementById("quantity")

    add.addEventListener('click', function(){
        quantity.value = parseInt(quantity.value) + 1
    })

    remove.addEventListener('click', function(){
        if (parseInt(quantity.value) > 1) {
            quantity.value = parseInt(quantity.value) - 1
        }
    })



</script>
