{% extends 'base.html' %}

{% block content %}
<div class="col">
  <h4 class="text-center">{{ message }}</h4>

  <div class="row">
    {% for product in product_list %}
      <div class="col-3 mt-5">
        <div class="card h-100">
          {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt="Imagen del producto" height="300">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title">{{ product.title }}</h5>
            <p class="card-text">{{ product.description|truncatewords:20 }}</p>
            <a href="{% url 'product' product.pk %}" class="btn btn-primary">Ver detalles</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
