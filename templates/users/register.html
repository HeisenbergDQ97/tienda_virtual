{% extends 'base.html' %}

{%block content %}
<div class=" row">
    <div class="col 3">
        <h2>Registro</h2>
        <!---formulario-->
        <form form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div class=" form-group">
                {{ field.label_tag }}
                {{ field }} 

                {% if field.errors %}
                        {{ field.errors }}
                {% endif %}
            </div>

            {% endfor %}
            <button type="submit" class="btn btn-primary">Registrar</button>
        </form>
    </div>        
</div>
{%endblock%}
