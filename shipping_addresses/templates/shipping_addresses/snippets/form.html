 <div class="mb-6">
  <form method="post">
      {% csrf_token %}

      {% for field in form %}
      <div class="mb-3">
          {{ field.label_tag }}
          {{ field }}

          {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}

      </div>
      {% endfor %}
      
      <button type="submit" class="btn btn-primary">Agregar</button>
  </form>
 </div>
