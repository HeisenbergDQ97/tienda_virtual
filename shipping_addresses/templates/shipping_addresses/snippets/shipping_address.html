<div class="card">
    <h5 class="card-header"> </h5>
    <div class="card-body">
        <h5 class="card-tittle">{{ shipping_address.address }}</h5>
        <div class="card-tittle">
            {{ shipping_address.reference }}
        </div>
        <div class="card-tittle">
            {{ shipping_address.postal_code }}
        </div>
        <div class="mt-2 mb-5">
            <a href="#" class="btn btn-info">Editar</a>
            {% if shipping_address.default %}
                <div class="text-info">
                   Dirección principal 
                </div>
            {% else %}
                <a href="#" class="btn btn-danger">Default</a>
            {% endif %}
        </div>
    </div>
</div>
